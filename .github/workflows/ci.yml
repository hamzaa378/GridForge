name: GridForge CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install TypeScript
        run: npm install --no-audit --no-fund
      - name: Install Chromium browser regression prerequisites
        run: |
          python -m pip install 'playwright>=1.56,<2'
          python -m playwright install --with-deps chromium
      - name: Python-only prebuilt release smoke (no pip modules)
        run: python scripts/python_smoke.py
      - name: Excel 506-function saved-reference regression
        run: npm run parity:snapshot
      - name: Core regression suite (TypeScript, 847+ tests and two 10k benchmarks)
        run: npm run regression:core
      - name: Offline macro CLI dry run
        run: node scripts/run_macro_offline.mjs --workbook examples/sample_gridforge_workbook.json --macro examples/macros/parameterized_tax.json --parameters examples/macros/parameter_values.json --dry-run
      - name: Isolated ribbon usability smoke (new tabs, shortcuts, themes, warnings)
        run: npm run regression:ribbon
      - name: XLSM preservation test
        run: python scripts/test_xlsm_browser.py
      - name: Excel VBA bridge protocol security test
        run: python scripts/test_vba_bridge_protocol.py
      - name: Upload compiled site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gridforge-dist
          path: dist/
          if-no-files-found: ignore
